syntax = "proto3";

package aegis.telemetry.v1;

option go_package = "github.com/DrDowellsHead/Aegis/internal/telemetry/v1;telemetryv1";

import "google/protobuf/timestamp.proto";

// TelemetryService is a deliberately small unary ingestion API.
// A successful RPC means received and validated, NOT durably stored.
service TelemetryService {
  rpc Send(SendRequest) returns (SendResponse);
}

message SendRequest {
  // Not authenticated in step 3.1. Must not be trusted as an identity.
  string agent_id = 1;
  // Unique per observation. Stable across future retries.
  string measurement_id = 2;
  Snapshot snapshot = 3;
}

message SendResponse {
  // Only volatile validation/receipt. Never a durable queue ACK.
  bool received = 1;
}

message Snapshot {
  uint32 schema_version = 1;
  google.protobuf.Timestamp started_at = 2;
  int64 duration_ms = 3;
  string os = 4;
  string arch = 5;
  CPU cpu = 6;
  Memory memory = 7;
  Disk disk = 8;
  repeated NetworkInterface network = 9;
  map<string, string> errors = 10;
  // Distinguishes a successful empty network collection from a missing value.
  bool network_available = 11;
}

message CPU {
  double used_percent = 1;
}

message Memory {
  uint64 total_bytes = 1;
  uint64 available_bytes = 2;
  uint64 used_bytes = 3;
  double used_percent = 4;
}

message Disk {
  string path = 1;
  uint64 total_bytes = 2;
  uint64 free_bytes = 3;
  uint64 used_bytes = 4;
  double used_percent = 5;
}

message NetworkInterface {
  string name = 1;
  uint64 bytes_sent = 2;
  uint64 bytes_received = 3;
}
