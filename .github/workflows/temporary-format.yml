name: Temporary secure-telemetry validation
on:
  push:
    branches: [develop]
    paths: [".github/workflows/temporary-format.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Normalize Go formatting
        run: gofmt -w internal/identity/*.go internal/telemetry/*.go internal/cli/*.go
      - name: Run tests
        run: go test -race -count=1 -timeout=60s ./...
      - name: Vet
        run: go vet ./...
      - name: Export normalized sources
        if: always()
        run: |
          for f in internal/identity/identity.go internal/identity/identity_test.go internal/identity/cert.go internal/identity/cert_test.go internal/telemetry/security.go internal/telemetry/receiver.go internal/telemetry/sender.go internal/telemetry/telemetry_test.go internal/cli/telemetry.go internal/cli/cli.go internal/cli/security_test.go; do
            printf 'AEGIS_SEC_BEGIN:%s\n' "$f"
            base64 -w0 "$f"
            printf '\nAEGIS_SEC_END:%s\n' "$f"
          done
