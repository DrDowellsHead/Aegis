name: Temporary database bootstrap
on:
  push:
    branches: [develop]
    paths: [.github/workflows/temporary-database.yml]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Regenerate protobuf and add PostgreSQL driver
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          bash scripts/generate-proto.sh
          go get github.com/jackc/pgx/v5@v5.7.6
          go mod tidy
      - name: Export generated code and lockfiles
        run: |
          for f in internal/telemetry/v1/telemetry.pb.go internal/telemetry/v1/telemetry_grpc.pb.go go.mod go.sum; do
            echo "BEGIN_AEGIS34:$f"
            base64 -w0 "$f"
            echo
            echo "END_AEGIS34:$f"
          done
