name: Format incident lifecycle (one-time)
on:
  push:
    branches: [develop]
    paths: [.github/workflows/format-incidents-53.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Format modified Go sources
        shell: bash
        run: |
          gofmt -w internal/storage/incidents.go internal/storage/incidents_test.go internal/storage/rules.go internal/storage/ready.go internal/dashboard/incidents.go internal/dashboard/incidents_test.go internal/dashboard/http.go
          git add internal/storage/incidents.go internal/storage/incidents_test.go internal/storage/rules.go internal/storage/ready.go internal/dashboard/incidents.go internal/dashboard/incidents_test.go internal/dashboard/http.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format incident lifecycle Go sources"
            git push origin HEAD:develop
          fi
