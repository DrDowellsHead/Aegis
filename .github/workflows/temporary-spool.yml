name: Temporary spool verification
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/temporary-spool.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Normalize Go formatting
        run: gofmt -w internal/spool/*.go internal/agent/forward*.go internal/telemetry/sender.go internal/cli/forward.go internal/cli/cli.go
      - name: Run race tests
        run: go test -race -count=1 -timeout=60s ./...
      - name: Vet
        run: go vet ./...
      - name: Export formatted sources
        if: always()
        run: |
          for f in internal/spool/spool.go internal/spool/spool_test.go internal/agent/forward.go internal/agent/forward_test.go internal/telemetry/sender.go internal/cli/forward.go internal/cli/cli.go; do
            printf 'AEGIS_SPOOL_BEGIN:%s\n' "$f"
            base64 -w0 "$f"
            printf '\nAEGIS_SPOOL_END:%s\n' "$f"
          done

# Re-check cancellation while backoff timer is active
