name: Format notification implementation (temporary)
on:
  push:
    branches: [develop]
    paths: [.github/workflows/format-notify-55.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Apply gofmt to Go notification files
        shell: bash
        run: |
          gofmt -w internal/storage/notifications.go internal/storage/notifications_test.go internal/storage/incidents.go internal/storage/incidents_test.go internal/storage/ready.go internal/notify/send.go internal/notify/send_test.go internal/cli/notify.go internal/cli/cli.go internal/dashboard/notifications.go internal/dashboard/http.go
          git add internal/storage/notifications.go internal/storage/notifications_test.go internal/storage/incidents.go internal/storage/incidents_test.go internal/storage/ready.go internal/notify/send.go internal/notify/send_test.go internal/cli/notify.go internal/cli/cli.go internal/dashboard/notifications.go internal/dashboard/http.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format transactional notification worker and transports"
            git push origin HEAD:develop
          fi
