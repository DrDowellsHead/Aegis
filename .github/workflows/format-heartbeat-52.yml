name: Format heartbeat implementation (one-time)
on:
  push:
    branches: [develop]
    paths: [.github/workflows/format-heartbeat-52.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Format changed Go files
        shell: bash
        run: |
          gofmt -w internal/storage/heartbeat.go internal/storage/heartbeat_test.go internal/storage/postgres.go internal/storage/agents.go internal/storage/agent_summary.go internal/storage/ready.go internal/telemetry/receiver.go internal/telemetry/sender.go internal/telemetry/heartbeat_test.go internal/telemetry/pg_integration_test.go internal/agent/heartbeat.go internal/agent/heartbeat_test.go internal/cli/forward.go
          git add internal/storage/heartbeat.go internal/storage/heartbeat_test.go internal/storage/postgres.go internal/storage/agents.go internal/storage/agent_summary.go internal/storage/ready.go internal/telemetry/receiver.go internal/telemetry/sender.go internal/telemetry/heartbeat_test.go internal/telemetry/pg_integration_test.go internal/agent/heartbeat.go internal/agent/heartbeat_test.go internal/cli/forward.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format agent heartbeat implementation"
            git push origin HEAD:develop
          fi
