name: Temporary browser E2E validation
on:
  push:
    branches: [develop]
    paths: [.github/workflows/temporary-browser.yml, web/package.json, web/src/**, web/e2e/**]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate updated npm lock
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Strict build
        working-directory: web
        run: npm run build
      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser E2E with mocked gateway contracts
        working-directory: web
        run: npm run e2e
      - name: Check browser output for server secrets
        run: |
          if grep -R -q -E 'postgres://|AEGIS_HISTORY_TOKEN|AEGIS_DATABASE_URL|AEGIS_DASHBOARD_TOKEN' web/dist; then
            echo "Server credential reference found in browser bundle"
            exit 1
          fi
      - name: Export npm lockfile
        if: success()
        run: |
          echo BEGIN_AEGIS45:web/package-lock.json
          base64 -w0 web/package-lock.json
          echo
          echo END_AEGIS45:web/package-lock.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-e2e-debug
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 3
