name: One-time Go formatting (4.6)
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/format-step-46.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Format only changed Aegis Go sources
        shell: bash
        run: |
          gofmt -w internal/dashboard/accounts.go internal/dashboard/accounts_test.go internal/dashboard/remote.go internal/dashboard/remote_test.go internal/dashboard/http.go internal/cli/dashboard.go internal/cli/dashboard_user.go internal/cli/dashboard_user_test.go internal/cli/cli.go
          git add internal/dashboard/accounts.go internal/dashboard/accounts_test.go internal/dashboard/remote.go internal/dashboard/remote_test.go internal/dashboard/http.go internal/cli/dashboard.go internal/cli/dashboard_user.go internal/cli/dashboard_user_test.go internal/cli/cli.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format remote dashboard Go implementation"
            git push origin HEAD:develop
          fi
