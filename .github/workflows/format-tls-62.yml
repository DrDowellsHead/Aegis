name: Format TLS lifecycle (temporary)
on:
  push:
    branches: [develop]
    paths: [.github/workflows/format-tls-62.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Format changed TLS source files
        shell: bash
        run: |
          gofmt -w internal/identity/pki.go internal/identity/pki_test.go internal/cli/tls.go internal/cli/tls_test.go internal/cli/cli.go internal/cli/telemetry.go internal/cli/dashboard.go internal/telemetry/security.go internal/telemetry/security_check_test.go internal/dashboard/remote.go
          git add internal/identity/pki.go internal/identity/pki_test.go internal/cli/tls.go internal/cli/tls_test.go internal/cli/cli.go internal/cli/telemetry.go internal/cli/dashboard.go internal/telemetry/security.go internal/telemetry/security_check_test.go internal/dashboard/remote.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format TLS certificate lifecycle implementation"
            git push origin HEAD:develop
          fi
