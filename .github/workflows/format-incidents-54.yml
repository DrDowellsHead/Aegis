name: One-time formatting for incident noise (5.4)
on:
  push:
    branches: [develop]
    paths: [.github/workflows/format-incidents-54.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Apply gofmt to step 5.4
        shell: bash
        run: |
          gofmt -w internal/storage/incidents.go internal/storage/incidents_test.go internal/storage/incident_policy.go internal/storage/incident_policy_test.go internal/dashboard/incidents.go internal/dashboard/incidents_test.go internal/storage/ready.go
          git add internal/storage/incidents.go internal/storage/incidents_test.go internal/storage/incident_policy.go internal/storage/incident_policy_test.go internal/dashboard/incidents.go internal/dashboard/incidents_test.go internal/storage/ready.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format incident cooldown and escalation implementation"
            git push origin HEAD:develop
          fi
