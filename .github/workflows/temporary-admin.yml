name: Temporary operator audit validation
on:
  push:
    branches: [develop]
    paths: [.github/workflows/temporary-admin.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aegis_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: aegis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis_test -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AEGIS_TEST_DATABASE_URL: postgres://aegis_test:ci-test-only@127.0.0.1:5432/aegis_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Normalize Go formatting
        run: gofmt -w internal/adminconfig/*.go internal/cli/admin.go internal/cli/admin_test.go internal/cli/retention.go internal/cli/backfill.go internal/cli/cli.go internal/storage/audit.go internal/storage/audit_test.go internal/storage/retention.go internal/storage/projection.go internal/storage/ready.go
      - name: Go tests and PostgreSQL integration
        run: go test -race -count=1 -timeout=120s ./...
      - name: Static analysis
        run: go vet ./...
      - name: Export normalized source
        if: always()
        run: |
          for f in internal/adminconfig/config.go internal/adminconfig/config_test.go internal/cli/admin.go internal/cli/admin_test.go internal/cli/retention.go internal/cli/backfill.go internal/cli/cli.go internal/storage/audit.go internal/storage/audit_test.go internal/storage/retention.go internal/storage/projection.go internal/storage/ready.go; do
            echo "BEGIN_AEGIS39:$f"
            base64 -w0 "$f"
            echo
            echo "END_AEGIS39:$f"
          done
