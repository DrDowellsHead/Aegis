name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=60s ./...
      - name: Test portable build mode
        run: go test -count=1 -timeout=60s ./...
        env:
          CGO_ENABLED: '0'
      - run: go build -trimpath -o bin/ ./cmd/aegis
        env:
          CGO_ENABLED: '0'
      - name: Smoke test
        shell: bash
        run: ./bin/aegis version
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: python3 scripts/package.py dev
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-development-builds
          path: dist/dev/*
          if-no-files-found: error
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aegis_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis_test -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AEGIS_TEST_DATABASE_URL: postgres://aegis_test:ci-test-only@127.0.0.1:5432/aegis_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: PostgreSQL + authenticated gRPC integration
        run: go test -p 1 -race -count=1 -timeout=90s ./internal/storage ./internal/telemetry ./internal/history

  web:
    name: Web dashboard (TypeScript and production bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked npm dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: UTC range and chart unit tests
        working-directory: web
        run: npm test
      - name: TypeScript and Vite production build
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser E2E with mocked gateway
        working-directory: web
        run: npm run e2e
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-traces
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Prevent server credential references in client bundle
        shell: bash
        run: |
          if grep -R -q -E 'postgres://|AEGIS_HISTORY_TOKEN|AEGIS_DATABASE_URL' web/dist/; then
            echo "Unexpected server-side credential reference found in browser output"
            exit 1
          fi
