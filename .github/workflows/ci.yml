name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          gofmt -d cmd internal
          test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      # Race instrumentation makes bcrypt-intensive dashboard tests slower on macOS ARM64.
      - run: go test -race -count=1 -timeout=180s ./...
      - name: Test portable build mode
        run: go test -count=1 -timeout=60s ./...
        env:
          CGO_ENABLED: '0'
      - run: go build -trimpath -o bin/ ./cmd/aegis
        env:
          CGO_ENABLED: '0'
      - name: Smoke test
        shell: bash
        run: ./bin/aegis version
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - run: python3 scripts/package.py dev
      - name: Verify release package checksums
        shell: bash
        run: (cd dist/dev && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aegis-development-builds
          path: dist/dev/*
          if-no-files-found: error
          retention-days: 7

  security:
    name: Dependency and supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify module checksums
        run: |
          go mod download
          go mod verify
      - name: Scan reachable Go vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aegis-tools"
          GOBIN="$RUNNER_TEMP/aegis-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$RUNNER_TEMP/aegis-tools/govulncheck" ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Audit all locked npm dependencies
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Enforce release workflow policy
        run: python3 -m unittest discover -s scripts -p 'test_release_quality.py' -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aegis_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis_test -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AEGIS_TEST_DATABASE_URL: postgres://aegis_test:ci-test-only@127.0.0.1:5432/aegis_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: PostgreSQL + authenticated gRPC integration
        run: go test -p 1 -race -count=1 -timeout=90s ./internal/storage ./internal/telemetry ./internal/history
      - name: Repeat bounded chaos and recovery tests
        run: go test -race -count=3 -timeout=120s -run '^TestChaos' ./internal/agent ./internal/telemetry
      - name: PostgreSQL 17 backup and restore into an empty database
        shell: bash
        env:
          AEGIS_DATABASE_URL: postgres://aegis_test:ci-test-only@127.0.0.1:5432/aegis_test?sslmode=disable
          AEGIS_RESTORE_DATABASE_URL: postgres://aegis_test:ci-test-only@127.0.0.1:5432/aegis_restore?sslmode=disable
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o ci-aegis ./cmd/aegis
          ./ci-aegis migrate
          docker run --rm --network host -e PGPASSWORD=ci-test-only postgres:17 \
            psql -h 127.0.0.1 -U aegis_test -d aegis_test -v ON_ERROR_STOP=1 \
            -c "INSERT INTO aegis_agents(agent_id,registered) VALUES ('123e4567-e89b-42d3-a456-426614174000', true) ON CONFLICT (agent_id) DO UPDATE SET registered=true"
          docker run --rm --network host -e PGPASSWORD=ci-test-only postgres:17 \
            psql -h 127.0.0.1 -U aegis_test -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE aegis_restore'
          mkdir -m 700 ci-backups
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e AEGIS_DATABASE_URL postgres:17 \
            ./ci-aegis backup --output /work/ci-backups/fixture.dump
          cp ci-backups/fixture.dump ci-backups/tampered.dump
          cp ci-backups/fixture.dump.sha256 ci-backups/tampered.dump.sha256
          printf 'corrupted' >> ci-backups/tampered.dump
          if docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e AEGIS_RESTORE_DATABASE_URL postgres:17 \
            ./ci-aegis restore --input /work/ci-backups/tampered.dump --confirm-empty-target; then
            echo "Corrupt backup was wrongly accepted"
            exit 1
          fi
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e AEGIS_RESTORE_DATABASE_URL postgres:17 \
            ./ci-aegis restore --input /work/ci-backups/fixture.dump --confirm-empty-target
          docker run --rm --network host -e PGPASSWORD=ci-test-only postgres:17 \
            psql -h 127.0.0.1 -U aegis_test -d aegis_restore -v ON_ERROR_STOP=1 \
            -Atc "SELECT count(*) FROM aegis_agents WHERE agent_id='123e4567-e89b-42d3-a456-426614174000' AND registered" | grep -qx 1
          if docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e AEGIS_RESTORE_DATABASE_URL postgres:17 \
            ./ci-aegis restore --input /work/ci-backups/fixture.dump --confirm-empty-target; then
            echo "Restore into populated target was wrongly accepted"
            exit 1
          fi

  web:
    name: Web dashboard (TypeScript and production bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked npm dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: UTC range and chart unit tests
        working-directory: web
        run: npm test
      - name: TypeScript and Vite production build
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser E2E with mocked gateway
        working-directory: web
        run: npm run e2e
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-e2e-traces
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Prevent server credential references in client bundle
        shell: bash
        run: |
          if grep -R -q -E 'postgres://|AEGIS_HISTORY_TOKEN|AEGIS_DATABASE_URL' web/dist/; then
            echo "Unexpected server-side credential reference found in browser output"
            exit 1
          fi
