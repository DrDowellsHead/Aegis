name: Format agent token lifecycle (temporary)
on:
  push:
    branches: [develop]
    paths: [.github/workflows/format-agent-token-61.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Format Go lifecycle files
        shell: bash
        run: |
          gofmt -w internal/identity/rotation.go internal/identity/rotation_test.go internal/cli/agent_token.go internal/cli/agent_token_test.go internal/cli/cli.go
          git add internal/identity/rotation.go internal/identity/rotation_test.go internal/cli/agent_token.go internal/cli/agent_token_test.go internal/cli/cli.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format agent token rotation and revocation implementation"
            git push origin HEAD:develop
          fi
