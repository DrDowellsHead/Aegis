name: Format security audit (temporary)
on:
  push:
    branches: [develop]
    paths: [.github/workflows/format-security-63.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Format security audit sources
        shell: bash
        run: |
          gofmt -w internal/storage/security_audit.go internal/storage/security_audit_test.go internal/storage/ready.go internal/dashboard/security.go internal/dashboard/security_test.go internal/dashboard/remote.go internal/dashboard/http.go internal/dashboard/http_test.go
          git add internal/storage/security_audit.go internal/storage/security_audit_test.go internal/storage/ready.go internal/dashboard/security.go internal/dashboard/security_test.go internal/dashboard/remote.go internal/dashboard/http.go internal/dashboard/http_test.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format security audit and access-control tests"
            git push origin HEAD:develop
          fi
