name: Format automatic watch (temporary)
on:
  push:
    branches: [develop]
    paths: [.github/workflows/format-watch-57.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Format Go files modified in 5.7
        shell: bash
        run: |
          gofmt -w internal/storage/watch.go internal/storage/watch_test.go internal/storage/ready.go internal/storage/rules.go internal/storage/incidents.go internal/watch/cycle.go internal/watch/cycle_test.go internal/cli/cli.go internal/cli/watch.go internal/cli/watch_test.go internal/dashboard/http.go internal/dashboard/watch.go internal/dashboard/watch_test.go
          git add internal/storage/watch.go internal/storage/watch_test.go internal/storage/ready.go internal/storage/rules.go internal/storage/incidents.go internal/watch/cycle.go internal/watch/cycle_test.go internal/cli/cli.go internal/cli/watch.go internal/cli/watch_test.go internal/dashboard/http.go internal/dashboard/watch.go internal/dashboard/watch_test.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format automatic watch implementation and tests"
            git push origin HEAD:develop
          fi
