name: Temporary web scaffold validation
on:
  push:
    branches: [develop]
    paths: [.github/workflows/temporary-web.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned versions into npm lock
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck and compile
        working-directory: web
        run: npm run build
      - name: Validate bundle contains no server secrets
        shell: bash
        run: |
          if grep -R -q -E 'postgres://|AEGIS_HISTORY_TOKEN|AEGIS_DATABASE_URL' web/dist/; then
            echo "Unexpected server secret marker in browser build!"
            exit 1
          fi
      - name: Export npm lock for reproducible CI
        if: success()
        shell: bash
        run: |
          echo "BEGIN_AEGIS41:web/package-lock.json"
          base64 -w0 web/package-lock.json
          echo
          echo "END_AEGIS41:web/package-lock.json"
