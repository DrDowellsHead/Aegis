name: One-time Go formatting (5.1)
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/format-step-51.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Format Go source files changed by step 5.1
        shell: bash
        run: |
          gofmt -w internal/alerts/rules.go internal/alerts/rules_test.go internal/storage/rules.go internal/storage/rules_test.go internal/storage/ready.go internal/dashboard/rules.go internal/dashboard/rules_test.go internal/dashboard/http.go
          git add internal/alerts internal/storage/rules.go internal/storage/rules_test.go internal/storage/ready.go internal/dashboard/rules.go internal/dashboard/rules_test.go internal/dashboard/http.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format threshold rule implementation"
            git push origin HEAD:develop
          fi
