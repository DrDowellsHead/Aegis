name: Release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=60s ./...
  draft:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit in main history
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: python3 scripts/package.py "$VERSION"
      - name: Create draft with assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--draft --verify-tag --generate-notes --title "Aegis $VERSION")
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$VERSION" "${args[@]}" dist/"$VERSION"/*
