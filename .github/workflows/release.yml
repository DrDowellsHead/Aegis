name: Release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=180s ./...
      - name: Test portable build mode
        run: go test -count=1 -timeout=60s ./...
        env:
          CGO_ENABLED: '0'
  security:
    name: Release dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify Go supply-chain integrity
        run: |
          go mod download
          go mod verify
      - name: Scan Go vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aegis-tools"
          GOBIN="$RUNNER_TEMP/aegis-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$RUNNER_TEMP/aegis-tools/govulncheck" ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Audit web dependencies
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Enforce release workflow policy
        run: python3 -m unittest discover -s scripts -p 'test_release_quality.py' -v
  draft:
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit in main history
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: python3 scripts/package.py "$VERSION"
      - name: Verify all archive digests
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: (cd "dist/$VERSION" && sha256sum -c SHA256SUMS)
      - name: Create draft with assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--draft --verify-tag --generate-notes --title "Aegis $VERSION")
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$VERSION" "${args[@]}" dist/"$VERSION"/*
