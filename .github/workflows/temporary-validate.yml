name: Temporary telemetry validation
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/temporary-validate.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Format and tidy
        run: |
          gofmt -w internal/telemetry/convert.go internal/telemetry/receiver.go internal/telemetry/sender.go internal/telemetry/telemetry_test.go internal/cli/telemetry.go internal/cli/cli.go
          go mod tidy
      - name: Run tests
        run: go test -race -count=1 ./...
      - name: Export normalized files
        if: always()
        run: |
          for f in internal/telemetry/convert.go internal/telemetry/receiver.go internal/telemetry/sender.go internal/telemetry/telemetry_test.go internal/cli/telemetry.go internal/cli/cli.go go.mod go.sum; do
            printf 'AEGIS_NORM_BEGIN:%s\n' "$f"
            base64 -w0 "$f"
            printf '\nAEGIS_NORM_END:%s\n' "$f"
          done
